<script>
(() => {
  const container = document.getElementById('productsContainer');
  if (!container) return;

  const revealCards = () => {
    const cards = Array.from(container.querySelectorAll('.product'));
    if (!cards.length) return false;

    const columns = Math.max(1, getComputedStyle(container).gridTemplateColumns.split(' ').length);
    const leftSideCount = Math.ceil(columns / 2);
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    cards.forEach((card, index) => {
      const column = index % columns;
      const positionInRow = column < leftSideCount ? column : column - leftSideCount;
      card.classList.add('product-reveal', column < leftSideCount ? 'reveal-from-left' : 'reveal-from-right');
      card.style.setProperty('--reveal-delay', `${positionInRow * 75}ms`);

      if (reduceMotion || !('IntersectionObserver' in window)) {
        card.classList.add('is-visible');
      }
    });

    if (!reduceMotion && 'IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries, currentObserver) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-visible');
          currentObserver.unobserve(entry.target);
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -5% 0px' });
      cards.forEach(card => observer.observe(card));
    }
    return true;
  };

  if (!revealCards()) {
    const renderObserver = new MutationObserver(() => {
      if (revealCards()) renderObserver.disconnect();
    });
    renderObserver.observe(container, { childList: true });
  }
})();
